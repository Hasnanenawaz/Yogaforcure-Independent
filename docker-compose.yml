services:
  app:
    build:
      context: .
      args:
        DATABASE_URL: postgresql://postgres:postgres@postgres:5432/yogabyneha

    container_name: yogabyneha_app
    restart: unless-stopped

    ports:
      - "127.0.0.1:3000:3000"

    env_file:
      - .env

    depends_on:
      - postgres

    command: sh -c "node server.js"

  postgres:
    image: postgres:16
    container_name: yogabyneha_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yogabyneha

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
